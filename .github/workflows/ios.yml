name: iOS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    # The app uses iOS 26 APIs behind availability checks (SundialNavView's
    # glassEffect). An availability check does not help a compiler whose SDK
    # has never heard of the symbol, so this needs an image carrying Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          # Pick the highest installed version rather than hardcoding a path,
          # so an image refresh cannot silently drop the build onto an older
          # SDK where the iOS 26 APIs vanish again.
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i "iphonesimulator" || true

      # Config.swift is git-ignored because it carries environment values.
      # Repository secrets fill it in when available; otherwise the
      # placeholders still compile, which is all this job needs.
      - name: Generate Config.swift
        env:
          FRISFOCUS_SUPABASE_URL: ${{ secrets.FRISFOCUS_SUPABASE_URL }}
          FRISFOCUS_SUPABASE_ANON_KEY: ${{ secrets.FRISFOCUS_SUPABASE_ANON_KEY }}
          FRISFOCUS_RORK_AUTH_URL: ${{ secrets.FRISFOCUS_RORK_AUTH_URL }}
          FRISFOCUS_RORK_APP_KEY: ${{ secrets.FRISFOCUS_RORK_APP_KEY }}
          FRISFOCUS_PROJECT_ID: ${{ secrets.FRISFOCUS_PROJECT_ID }}
        run: ./scripts/bootstrap-config.sh

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios-frisfocus/FrisFocus.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The compile check is the point of this job: it is the only thing
      # standing between an edit and a broken build, since the agents
      # doing the work have no Swift toolchain.
      - name: Build (compile check)
        working-directory: ios-frisfocus
        run: |
          set -o pipefail
          xcodebuild build \
            -project FrisFocus.xcodeproj \
            -scheme FrisFocus \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # xcodebuild prints each error where it happens, thousands of lines
      # up from the end — and the log APIs only hand back the tail, so a
      # failure reads as "exit code 65" with no cause. Reprint just the
      # diagnostics at the very bottom, where they can actually be read.
      - name: Compiler errors
        if: failure()
        run: |
          # Errors first and on their own. Sorting them together with
          # warnings let a wall of pre-existing warnings push the actual
          # errors off the end, which is how the first version of this
          # step managed to be useless.
          echo "### Errors"
          grep -E "error: " "$RUNNER_TEMP/build.log" \
            | sed 's|/Users/runner/work/frisfocusios/frisfocusios/||' \
            | sort -u | head -40 || echo "(none matched)"
          echo "::group::Warnings (informational)"
          grep -E "warning: " "$RUNNER_TEMP/build.log" \
            | sed 's|/Users/runner/work/frisfocusios/frisfocusios/||' \
            | sort -u | head -30 || echo "(none)"
          echo "::endgroup::"

      - name: Pick a simulator
        id: sim
        run: |
          # Resolve a concrete booted-capable device rather than hardcoding a
          # name that a future runner image might not ship.
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
                          print(next(x['udid'] for rt in d for x in d[rt] if 'iPhone' in x['name']))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Using simulator $udid"

      - name: Test
        working-directory: ios-frisfocus
        run: |
          set -o pipefail
          xcodebuild test \
            -project FrisFocus.xcodeproj \
            -scheme FrisFocus \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Test failures
        if: failure()
        run: |
          echo "### Failures"
          grep -E "error: |✘|Test .* failed|failed after" "$RUNNER_TEMP/test.log" \
            | sed 's|/Users/runner/work/frisfocusios/frisfocusios/||' \
            | sort -u | head -40 || echo "(none matched)"

  backend:
    name: Edge functions typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check edge functions
        run: |
          # Type-check every function entrypoint. Remote imports are
          # fetched once and cached by Deno.
          for f in backend/functions/*/index.ts; do
            echo "==> $f"
            deno check "$f"
          done
