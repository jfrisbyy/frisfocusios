name: iOS

on:
  push:
    branches: ["**"]
    # macOS runners bill at 10x, so a README- or migration-note-only
    # commit has no business starting one. Anything that can change what
    # compiles or what the functions do is listed here.
    paths:
      - "ios-frisfocus/**"
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/ios.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  # Deliberately NOT cancel-in-progress. Superseding runs looks like the
  # frugal choice, but it repeatedly destroyed the only evidence of why a
  # build failed: pushing a fix cancelled the run that would have named
  # the error, so each diagnosis cost two cycles instead of one. Letting
  # runs finish costs runner minutes; cancelling them cost the ability to
  # attribute a failure to a commit at all. The group still serialises
  # per-ref so runs queue rather than pile up.
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & test
    # The app uses iOS 26 APIs behind availability checks (SundialNavView's
    # glassEffect). An availability check does not help a compiler whose SDK
    # has never heard of the symbol, so this needs an image carrying Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          # Pick the highest installed version rather than hardcoding a path,
          # so an image refresh cannot silently drop the build onto an older
          # SDK where the iOS 26 APIs vanish again.
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i "iphonesimulator" || true

      # Config.swift is git-ignored because it carries environment values.
      # Repository secrets fill it in when available; otherwise the
      # placeholders still compile, which is all this job needs.
      - name: Generate Config.swift
        env:
          FRISFOCUS_SUPABASE_URL: ${{ secrets.FRISFOCUS_SUPABASE_URL }}
          FRISFOCUS_SUPABASE_ANON_KEY: ${{ secrets.FRISFOCUS_SUPABASE_ANON_KEY }}
          FRISFOCUS_RORK_AUTH_URL: ${{ secrets.FRISFOCUS_RORK_AUTH_URL }}
          FRISFOCUS_RORK_APP_KEY: ${{ secrets.FRISFOCUS_RORK_APP_KEY }}
          FRISFOCUS_PROJECT_ID: ${{ secrets.FRISFOCUS_PROJECT_ID }}
        run: ./scripts/bootstrap-config.sh

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios-frisfocus/FrisFocus.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick a simulator
        id: sim
        run: |
          # Resolve a concrete booted-capable device rather than hardcoding a
          # name that a future runner image might not ship.
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
                          print(next(x['udid'] for rt in d for x in d[rt] if 'iPhone' in x['name']))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Using simulator $udid"

      # This is both the compile check and the test run. `xcodebuild
      # test` builds the whole scheme anyway, so running a separate
      # `xcodebuild build` first was paying for the entire compile twice
      # on a runner that bills at 10x.
      - name: Build & test
        working-directory: ios-frisfocus
        run: |
          set -o pipefail
          xcodebuild test \
            -project FrisFocus.xcodeproj \
            -scheme FrisFocus \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      # One log now, so one place to read a failure from. Diagnostics
      # print LAST because the log APIs only return the tail of a job —
      # anything above the final screenful is unreachable.
      - name: What went wrong
        if: failure()
        run: |
          echo "::group::Warnings (first 10, informational)"
          grep -E "warning: " "$RUNNER_TEMP/xcodebuild.log" \
            | sed 's|/Users/runner/work/frisfocusios/frisfocusios/||' \
            | sort -u | head -10 || echo "(none)"
          echo "::endgroup::"
          echo "================ FAILING TESTS ================"
          grep -E "✘|Test .* failed|failed after" "$RUNNER_TEMP/xcodebuild.log" \
            | sed 's|/Users/runner/work/frisfocusios/frisfocusios/||' \
            | sort -u | head -20 || echo "(none)"
          echo "================ COMPILER ERRORS ================"
          grep -E "error: " "$RUNNER_TEMP/xcodebuild.log" \
            | sed 's|/Users/runner/work/frisfocusios/frisfocusios/||' \
            | sort -u | head -40 || echo "(none matched)"

  backend:
    name: Edge functions typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check edge functions
        run: |
          # Type-check every function entrypoint. Remote imports are
          # fetched once and cached by Deno.
          for f in backend/functions/*/index.ts; do
            echo "==> $f"
            deno check "$f"
          done
